# Toy proof-of-concept (WP-T): two tiny MoE LMs trained from scratch, then an
# expert-level translator between them. Differences between A and B stand in
# for Rung 3 "cross-family": tokenizer, width, expert count/granularity, seed.
out_dir: results/toy_poc
seq_chars: 256        # every sample is a 256-char window of text
p_recall: 0.5         # share of synthetic key->value recall docs (rest: prose/code)
val_share: 0.1        # papers/ and stdlib FILES held out for selection (audit M6) ...
test_share: 0.1       # ... and for reported ordinary-text numbers; BPE and training see the rest
steps: 4000
batch_size: 32
lr: 0.003
model_a:              # "informed" model: char-level, wide, coarse experts
  tokenizer: char
  d_model: 128
  n_layers: 4
  n_heads: 4
  n_experts: 8
  top_k: 2
  d_expert: 256
  seed: 0
model_b:              # "receiving" model: BPE, narrower, fine-grained experts
  tokenizer: bpe
  bpe_vocab: 1024
  d_model: 96
  n_layers: 4
  n_heads: 4
  n_experts: 16
  top_k: 2
  d_expert: 96
  seed: 1
bridge:
  layer_a: 3          # transmit an expert from A's last layer
  layer_b: 1          # inject into B after block 1 (2 blocks above it)
  d_bus: 64
  n_heads: 4
  steps: 600
  batch_size: 16
  lr: 0.002
  answer_weight: 1.0   # extra loss on answer-digit tokens (Test B positions)
fused:                # WP-T2: both models in lockstep, bidirectional links (scripts/toy_fused.py)
  steps: 1500
  batch_size: 16
  lr: 0.002
  answer_weight: 1.0
  d_bus: 64
  n_heads: 4
  p_split: 0.5        # split-view recall: each stored value is masked in exactly one model's view
  variants:
    ab_all:   {pair: ab, links: [0, 1, 2, 3], signal: moe}   # A<->B after every block
    ab_early: {pair: ab, links: [0], signal: moe}            # one exchange, after block 0 only
    bb_all:   {pair: bb, links: [0, 1, 2, 3], signal: moe}   # control: B fused with a copy of itself
    # translator-routed: each routed expert's own output is a separate, expert-tagged
    # bus entry and the receiver's cross-attention picks which foreign experts to read
    ab_experts_all:   {pair: ab, links: [0, 1, 2, 3], signal: experts}
    ab_experts_early: {pair: ab, links: [0], signal: experts}
    bb_experts_all:   {pair: bb, links: [0, 1, 2, 3], signal: experts}  # self-fusion control
    # + char-distance relative attention bias (the coordinate both tokenizers share), 2x steps
    ab_all_rel:         {pair: ab, links: [0, 1, 2, 3], signal: moe, rel_pos: true, steps: 3000}
    ab_early_rel:       {pair: ab, links: [0], signal: moe, rel_pos: true, steps: 3000}
    ab_experts_all_rel: {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, steps: 3000}
    aa_experts_all_rel: {pair: aa, links: [0, 1, 2, 3], signal: experts, rel_pos: true, steps: 3000}  # capacity control
    # leak-proof (safe_mask): a partner may read a BPE token only once its pre-token chunk is
    # closed, so token boundaries cannot reveal unseen chars (see blammoe/toy/audit.py)
    ab_experts_all_rel_safe: {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, safe_mask: true, steps: 3000}
    ab_resid_all_rel_safe:   {pair: ab, links: [0, 1, 2, 3], signal: resid, rel_pos: true, safe_mask: true, steps: 3000}  # model-level baseline
    # WP-T3 stage 2: continue ab_experts_all_rel's links on ordinary text only (scripts/toy_fused_reward.py)
    ab_experts_all_rel_plain:  {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, init_from: ab_experts_all_rel, stage2: plain}
    ab_experts_all_rel_reward: {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, init_from: ab_experts_all_rel, stage2: reward}
stage2:               # WP-T3: reinforce partner-dependent wins (both arms: same data/steps/lr)
  steps: 1000
  batch_size: 16
  lr: 0.0002          # with 100-step warmup + cosine decay
  lam: 2.0            # reward arm: partner-dependent win tokens count 1 + lam = 3x in the CE mean
hide:                 # audit M3 attribution controls (scripts/toy_fused_hide.py)
  finetune_steps: 300 # recovery fine-tune: links retrained with the chosen experts hidden (0 = skip)
  finetune_warmup: 50
  lr: 0.002           # warmup, then cosine decay; batch size from fused
