# Does A get prose from B once its reader starts open? (docs/toy-char-gate-results.md, next ideas)
# The complementary run's A (char, code-heavy) + B (BPE, prose-heavy) pair and expert-bus recipe
# (translator seed 0, so toy_complement's s and c units are the shut-gate comparison), with A's readers
# starting at tanh 0.3 on every link. B's readers start shut, as before.
#   b<i> = s_i's A + s_i's B;  k<i> = s_i's A + c_i's B (code-heavy BPE: A's control, same gate start)
base: configs/toy_poc.yaml
out_dir: results/toy_ab_gate        # symlink to the Data drive
models_from: results/toy_complement
seeds: [[0, 1], [2, 3], [4, 5]]
variants: [ab_experts_all_rel_safe_text_ga3]
rung2: false
hide: false
controls:                           # must match toy_complement.yaml: the pairs name its c units' models
  - {name: c, keep: model_a, override: {model_b: {p_prose: 0.1}}}
  - {name: d, keep: model_b, override: {model_a: {p_prose: 0.9}}}
pairs:
  - {name: b, model_a: [s, model_a], model_b: [s, model_b]}
  - {name: k, model_a: [s, model_a], model_b: [c, model_b]}
overrides:
  model_a: {p_prose: 0.1}
  model_b: {p_prose: 0.9}
  fused:
    variants:
      ab_experts_all_rel_safe_text_ga3: {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0, gate_start_a: 0.3}
