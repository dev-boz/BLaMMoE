# Which channel carries what between the char models (docs/review-2026-10-31.md, next step 2). Same
# pairs and unforced recipe as toy_char_pair (translator seed 0, so its experts / resid runs are the
# comparison), two new channels:
#   moe       - each layer's router-weighted MoE output (one vector per position) instead of the
#               per-expert bus. If A gets prose this way but not from separate expert entries, the
#               block is reading individual experts, not what the partner knows.
#   resid_012 - the residual stream without the final link (after the last layer). The char-pair
#               hand-over mostly came through that link; what's left has to pass the reader's own layers.
#   e<i> = s_i's A + d_i's A';  f<i> = s_i's A + s_{i+1}'s A (A's control);  h<i> = d_i's A' + d_{i+1}'s A' (A''s control)
base: configs/toy_poc.yaml
out_dir: results/toy_char_channel   # symlink to the Data drive
models_from: results/toy_complement
seeds: [[0, 1], [2, 3], [4, 5]]
variants: [ab_moe_all_rel_safe_text, ab_resid_012_rel_safe_text]
rung2: false
hide: false
controls:                           # must match toy_complement.yaml: the pairs name its d units' models
  - {name: c, keep: model_a, override: {model_b: {p_prose: 0.1}}}
  - {name: d, keep: model_b, override: {model_a: {p_prose: 0.9}}}
pairs:
  - {name: e, model_a: [s, model_a], model_b: [d, model_a]}
  - {name: f, model_a: [s, model_a], model_b: [s, model_a, 1]}
  - {name: h, model_a: [d, model_a], model_b: [d, model_a, 1]}
overrides:
  model_a: {p_prose: 0.1}
  model_b: {p_prose: 0.9}
  fused:
    variants:
      ab_moe_all_rel_safe_text:   {pair: ab, links: [0, 1, 2, 3], signal: moe, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0}
      ab_resid_012_rel_safe_text: {pair: ab, links: [0, 1, 2], signal: resid, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0}
