# Controls for the char-pair "direction effect" (docs/review-2026-10-31.md, next step 1). Every earlier
# translator had fused.seed 0 (one init, one draw order) and the code-heavy model in slot a. Here:
# translator seed 1, expert bus only, the same unforced recipe, models copied from toy_complement.
#   e<i> = s_i's A + d_i's A'          (the char-pair e unit again, new translator seed)
#   x<i> = d_i's A' + s_i's A          (slots swapped)
#   g<i> = s_i's A + d_{i+1}'s A'      (a prose partner that doesn't share A's init)
#   f<i> = s_i's A + s_{i+1}'s A       (control for A's prose gain, as in toy_char_pair)
#   h<i> = d_i's A' + d_{i+1}'s A'     (control for A''s code gain: a prose-heavy partner)
# Read: A on prose in e / x / g vs f, and A' on code in e / x vs h. A direction effect survives if
# A' still gets code from A, and A still gets no prose from A', in both slot orders and with g.
base: configs/toy_poc.yaml
out_dir: results/toy_char_ctrl      # symlink to the Data drive
models_from: results/toy_complement
seeds: [[0, 1], [2, 3], [4, 5]]
variants: [ab_experts_all_rel_safe_text]
rung2: false
hide: false
controls:                           # must match toy_complement.yaml: the pairs name its d units' models
  - {name: c, keep: model_a, override: {model_b: {p_prose: 0.1}}}
  - {name: d, keep: model_b, override: {model_a: {p_prose: 0.9}}}
pairs:
  - {name: e, model_a: [s, model_a], model_b: [d, model_a]}
  - {name: x, model_a: [d, model_a], model_b: [s, model_a]}
  - {name: g, model_a: [s, model_a], model_b: [d, model_a, 1]}
  - {name: f, model_a: [s, model_a], model_b: [s, model_a, 1]}
  - {name: h, model_a: [d, model_a], model_b: [d, model_a, 1]}
overrides:
  model_a: {p_prose: 0.1}
  model_b: {p_prose: 0.9}
  fused:
    seed: 1                         # translator init + training draw order (every earlier run: 0)
    variants:                       # toy_complement's expert-bus variant, unchanged
      ab_experts_all_rel_safe_text: {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0}
