# Both ways at once on links 0-1 only (docs/toy-char-gate3-results.md, next ideas)
# toy_char_gate2way012 with link 2 taken away too. On links 0-2 the transfer went mostly through link 2,
# the latest on offer. Does it move down to link 1 again, and stay low-dependence, or stop?
#   e<i> = s_i's A + d_i's A';  f<i> = s_i's A + s_{i+1}'s A (A's control);
#   h<i> = d_i's A' + d_{i+1}'s A' (A''s control). All with both gate starts.
base: configs/toy_poc.yaml
out_dir: results/toy_char_gate2way01   # symlink to the Data drive
models_from: results/toy_complement
seeds: [[0, 1], [2, 3], [4, 5]]
variants: [ab_experts_01_rel_safe_text_ga3b3]
rung2: false
hide: false
controls:                           # must match toy_complement.yaml: the pairs name its d units' models
  - {name: c, keep: model_a, override: {model_b: {p_prose: 0.1}}}
  - {name: d, keep: model_b, override: {model_a: {p_prose: 0.9}}}
pairs:
  - {name: e, model_a: [s, model_a], model_b: [d, model_a]}
  - {name: f, model_a: [s, model_a], model_b: [s, model_a, 1]}
  - {name: h, model_a: [d, model_a], model_b: [d, model_a, 1]}
overrides:
  model_a: {p_prose: 0.1}
  model_b: {p_prose: 0.9}
  fused:
    variants:
      ab_experts_01_rel_safe_text_ga3b3: {pair: ab, links: [0, 1], signal: experts, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0, gate_start_a: 0.3, gate_start_b: 0.3}
