# Complementary models (HANDOFF "START HERE"): scripts/toy_sweep.py configs/toy_complement.yaml.
# A (char) pretrains on mostly code, B (BPE, fitted on B's own mix) on mostly prose; the links
# then train on ordinary text only (no split recall), so any transfer happens because it helps.
# Success: a model's bits/char on the domain it saw little of (A: prose, B: code) beat solo AND
# the shuffled partner, and beat the same-domain control partner (c / d units) by more.
base: configs/toy_poc.yaml
out_dir: results/toy_complement   # make it a symlink to the Data drive first (see HANDOFF)
seeds: [[0, 1], [2, 3], [4, 5]]   # s0 = the toy_poc / toy_sweep seeds; run s0 c0 d0 first
variants: [ab_experts_all_rel_safe_text, ab_resid_all_rel_safe_text]
rung2: false
hide: false                       # attribution is on split recall, which these links never trained on
controls:                         # same-domain partner: same architecture, seed and size, other mix
  - {name: c, keep: model_a, override: {model_b: {p_prose: 0.1}}}   # A with a code-heavy B (control for A's prose gain)
  - {name: d, keep: model_b, override: {model_a: {p_prose: 0.9}}}   # B with a prose-heavy A (control for B's code gain)
overrides:
  model_a: {p_prose: 0.1}         # recall docs stay at p_recall 0.5, so the models match the sweep's
  model_b: {p_prose: 0.9}
  fused:
    variants:                     # the sweep's leak-proof pair, links on ordinary text only
      ab_experts_all_rel_safe_text: {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0}
      ab_resid_all_rel_safe_text:   {pair: ab, links: [0, 1, 2, 3], signal: resid, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0}
