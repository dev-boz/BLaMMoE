# Both ways at once on the cross-tokenizer pair (docs/toy-char-gate2-results.md, next ideas)
# toy_ab_gate with B's readers also starting at tanh 0.3. Translator seed 0, so toy_ab_gate (A open
# only) and toy_complement (both shut) are the comparisons.
#   b<i> = s_i's A + s_i's B;  k<i> = s_i's A + c_i's B (code-heavy BPE: A's control);
#   j<i> = d_i's A (prose-heavy char) + s_i's B (B's control; toy_complement d is its shut-gate twin)
base: configs/toy_poc.yaml
out_dir: results/toy_ab_gate2way    # symlink to the Data drive
models_from: results/toy_complement
seeds: [[0, 1], [2, 3], [4, 5]]
variants: [ab_experts_all_rel_safe_text_ga3b3]
rung2: false
hide: false
controls:                           # must match toy_complement.yaml: the pairs name its c and d units' models
  - {name: c, keep: model_a, override: {model_b: {p_prose: 0.1}}}
  - {name: d, keep: model_b, override: {model_a: {p_prose: 0.9}}}
pairs:
  - {name: b, model_a: [s, model_a], model_b: [s, model_b]}
  - {name: k, model_a: [s, model_a], model_b: [c, model_b]}
  - {name: j, model_a: [d, model_a], model_b: [s, model_b]}
overrides:
  model_a: {p_prose: 0.1}
  model_b: {p_prose: 0.9}
  fused:
    variants:
      ab_experts_all_rel_safe_text_ga3b3: {pair: ab, links: [0, 1, 2, 3], signal: experts, rel_pos: true, safe_mask: true, steps: 3000, p_split: 0.0, gate_start_a: 0.3, gate_start_b: 0.3}
