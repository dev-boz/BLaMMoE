[project]
name = "blammoe"
version = "0.0.1"
description = "BLaMMoE Phase 1 — expert-level cross-model latent alignment experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "einops>=0.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.24",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blammoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
